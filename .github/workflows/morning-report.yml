name: Water Oak morning report (to phone)
# Sends the numbers-only report to Shane's phone through the free ntfy app.
# Shane subscribes once to topic water-oak-shane-9b030b93 in the ntfy app. No accounts, no Claude.
on:
  schedule:
    - cron: '34 9 * * *'   # 4:34am Eastern (winter) / 5:34am (summer)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/morning-report.yml]
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node website/morning-report.mjs > report.txt && cat report.txt
      - run: |
          curl -fsS -H "Title: Water Oak report" --data-binary @report.txt https://ntfy.sh/water-oak-shane-9b030b93
      - if: failure()
        run: |
          curl -fsS -H "Title: Water Oak report" -d "Water Oak report didn't run today. Tell Claude." https://ntfy.sh/water-oak-shane-9b030b93
