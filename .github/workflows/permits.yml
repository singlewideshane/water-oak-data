name: Water Oak permit scan
# PAUSED Nov 1 2026: the Town portal runs Google reCAPTCHA on every search,
# so an unattended robot is not used. Lookups are done by hand on request.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node permits/permits.mjs
      - if: always()
        run: |
          git config user.name "permit-bot"
          git config user.email "permit-bot@users.noreply.github.com"
          git add permits/
          git diff --cached --quiet || git commit -m "Permit scan $(date +%F)"
          git pull --rebase
          git push
