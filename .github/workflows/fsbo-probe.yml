name: FSBO probe (one-time, saves nothing)
# Runs only when this file changes on the fsbo-probe branch. No schedule.
on:
  push:
    branches: [fsbo-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node probe/fsbo-probe.mjs
