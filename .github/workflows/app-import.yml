name: Listings app — copy live app into repo
# Run by hand. Copies the live Listings app (lambent-bublanina) from Netlify into app/src
# and commits it, so the app's code lives here. Reads the live app only; deploys nothing.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node app/import.mjs
      - run: |
          git config user.name "water-oak-data robot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src
          git diff --cached --quiet && echo "No changes." || (git commit -m "Copy live Listings app into app/src" && git push)
