name: Water Oak market scan
on:
  schedule:
    - cron: '0 23 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Google Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb
      - run: node scrape.mjs
      - run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data/market.json list-to-sold/to_check.csv data/repeated_cuts.json
          git diff --cached --quiet || git commit -m "Market scan $(date +%F)"
          git pull --rebase
          git push
