name: Water Oak market scan
on:
  schedule:
    - cron: '0 23 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scrape.mjs
      - run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Market scan $(date +%F)"
          git push
